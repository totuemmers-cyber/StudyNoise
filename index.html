<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyNoise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <main class="app">
    <h1>StudyNoise</h1>
    <p class="tagline">Shades of noise to focus, relax&nbsp;&amp;&nbsp;sleep.</p>

    <h2 class="group">Colours</h2>
    <div class="noises">
      <button class="noise" data-type="white">
        <span class="swatch white"></span>
        <span class="label">White</span>
        <span class="desc">Bright, even hiss</span>
      </button>
      <button class="noise" data-type="pink">
        <span class="swatch pink"></span>
        <span class="label">Pink</span>
        <span class="desc">Balanced, natural</span>
      </button>
      <button class="noise" data-type="brown">
        <span class="swatch brown"></span>
        <span class="label">Brown</span>
        <span class="desc">Deep, rumbling</span>
      </button>
      <button class="noise" data-type="blue">
        <span class="swatch blue"></span>
        <span class="label">Blue</span>
        <span class="desc">Hissy, airy highs</span>
      </button>
      <button class="noise" data-type="violet">
        <span class="swatch violet"></span>
        <span class="label">Violet</span>
        <span class="desc">Sharp treble</span>
      </button>
      <button class="noise" data-type="grey">
        <span class="swatch grey"></span>
        <span class="label">Grey</span>
        <span class="desc">Perceptually even</span>
      </button>
      <button class="noise" data-type="green">
        <span class="swatch green"></span>
        <span class="label">Green</span>
        <span class="desc">Mid, nature-like</span>
      </button>
      <button class="noise" data-type="black">
        <span class="swatch black"></span>
        <span class="label">Black</span>
        <span class="desc">Ultra-deep rumble</span>
      </button>
      <button class="noise" data-type="velvet"
        title="Sparse noise — mostly silence with scattered impulses. Flat like white, but smoother and silkier.">
        <span class="swatch velvet"></span>
        <span class="label">Velvet</span>
        <span class="desc">Sparse, silky hiss</span>
      </button>
    </div>

    <h2 class="group">Ambience</h2>
    <div class="noises">
      <button class="noise" data-type="rain"
        title="Synthesised rainfall — a soft wash with scattered droplets.">
        <span class="swatch rain"></span>
        <span class="label">Rain</span>
        <span class="desc">Soft, scattered drops</span>
      </button>
      <button class="noise" data-type="ocean"
        title="Slow ocean surf — waves that rise and break.">
        <span class="swatch ocean"></span>
        <span class="label">Ocean</span>
        <span class="desc">Rolling surf</span>
      </button>
      <button class="noise" data-type="wind"
        title="Wandering wind with rising and falling gusts.">
        <span class="swatch wind"></span>
        <span class="label">Wind</span>
        <span class="desc">Gentle gusts</span>
      </button>
    </div>

    <h2 class="group">Masking</h2>
    <div class="noises">
      <button class="noise" data-type="speech"
        title="Noise shaped to the speech band (~250 Hz–6 kHz) to mask the words of nearby voices, like office sound masking.">
        <span class="swatch speech"></span>
        <span class="label">Speech Masking</span>
        <span class="desc">Covers nearby voices</span>
      </button>
      <button class="noise" data-type="rumble"
        title="Low-frequency masker (~40–200 Hz) tuned to cover traffic, footsteps and HVAC thumps.">
        <span class="swatch rumble"></span>
        <span class="label">Rumble Masking</span>
        <span class="desc">Covers traffic &amp; thumps</span>
      </button>
    </div>

    <div class="controls">
      <label for="volume">Volume</label>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.4" />
    </div>

    <label class="toggle"
      title="Layers several synthetic voices into a soft café murmur — a more natural, speech-like masking texture. Off gives steady noise, which masks just as well. Applies to Speech Masking.">
      <input type="checkbox" id="babble" checked />
      <span>Café babble <span class="toggle-note">(Speech Masking)</span></span>
    </label>

    <p class="hint">Tap a noise to start or stop it.</p>
  </main>

  <script src="noise-dsp.js"></script>
  <script src="noise.js"></script>
  <script src="stars.js"></script>
</body>
</html>
